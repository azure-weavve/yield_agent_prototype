  legend:
    - {level: ppid, columns: [ppid]}

- id: step_passage_commonality
  name: 스텝 통과 공통성
  description: |
    "그 스텝을 거쳤는가" 자체를 후보로 낸다. 비정규 스텝(step_seq 접미 `EC`)처럼
    지나는 lot 과 안 지나는 lot 이 갈리는 축을 잡는다 — 비정규 스텝에서 문제가
    생겨 조치한 이력이 있어 그 자체가 분석 대상이다.
    전원이 거치는 정상 스텝은 타깃·대조군 커버리지가 같아 분리 점수 0 이 되어
    자동으로 탈락한다. 설비/PPID 축과 별개 도구인 이유는 게이트가 "같은 도구 안
    최고 점수" 를 요구하기 때문 — 한 도구에 섞으면 서로를 눌러 한쪽만 승인된다.
    분모도 다르다 — "지났는가" 는 모든 wafer 가 답할 수 있으므로 denominator: all 이다.
    다른 축은 그 스텝에 이력이 있고 그 레벨 컬럼이 결측이 아닌 wafer 만 분모에 넣는다.
    denominator: all 은 step_seq 처럼 결측이 없는 축에만 쓴다 — 결측 가능한 컬럼에
    달면 교정 전의 가짜 후보가 그대로 돌아온다.
    p_permutation 은 라벨을 root_lot 안에서 섞었을 때 이만한 분리가 나오는 비율이다.
    p_min_possible 이 크면(예: 0.1 이상) 표본이 작아 p 를 그 아래로 내릴 수 없다는
    뜻이지 신호가 약하다는 뜻이 아니다. 결과 최상위의 fdr_table 은 임계값별로 "이
    목록에 가짜가 몇 개 섞여 있는가" 를 센 것이다(행의 n_used 는 그 표를 만든 순열
    회차 수이며 n_null_mean 의 해상도를 뜻한다 - 19회면 평균이 0, 0.053, 0.105 ...
    값만 가질 수 있다). p_family_wise 는 후보 하나가 아니라 목록 전체의 1등이
    우연일 확률이고, p_family_wise_min_possible 이 그 바닥값이다 - 둘이 같으면
    이 표본으로는 더 내려갈 수 없다는 뜻이지 신호가 약하다는 뜻이 아니다.
  legend:
    - {level: step_passage, columns: [step_seq], denominator: all}
