  legend:
    - {level: step_passage, columns: [step_seq], denominator: all}

- id: metro_commonality
  tool: metro
  name: 계측값 공통성
  description: |
    타깃이 공유하는 **계측 구간**을 찾는다 — 두께·CD 같은 연속값을 분할점으로 잘라
    "이 스텝의 이 항목이 X 이상(또는 이하)" 을 후보로 낸다. 설비·PPID·통과 여부로
    안 갈릴 때, 또는 불량이 치수 이상으로 의심될 때 쓴다.
    후보 하나 = (스텝, item, split_value, split_direction). key 는 사람이 읽는
    형태("THK >= 129.0")이고, 숫자와 방향은 split_value·split_direction 에 따로
    실려 있으니 **key 문자열을 파싱하지 말고 그 두 필드를 읽어라.**
    split_direction 은 ge("이상") 또는 le("이하")다.
    ⚠️ **분할점은 탐색으로 고른 것이라 score 를 믿으면 안 된다.** 신호가 전혀 없는
    데이터에 판별선(score 0.5)을 걸어 본 실측에서, 계측 표본이 작으면 **후보의 48.7%가
    그 선을 넘었다**(전수 계측이면 0%). 분할점을 최대화해서 고르는 데다 계측된 wafer 가
    적으면 커버리지가 거칠게 양자화되기 때문이다. **score 가 높다는 것만으로 이 도구의
    후보를 채택하지 마라.** 반드시 결과 최상위의 fdr_table("이 목록에 가짜가 몇 개
    섞였나")과 후보별 p_permutation 을 함께 읽고 판단하라.
    p_permutation 은 계측 표본이 작을 때 **보수적으로(실제보다 크게) 나온다.** 계측된
    wafer 수가 회차마다 달라 참조집합이 줄고, 그만큼 바닥값이 올라가기 때문이다. 그러니
    이 축의 p 를 한 번 더 할인해서 읽지 마라 - 이미 할인돼 있다. p 하나만 보지 말고
    p_min_possible·n_reference·fdr_table 을 같이 보는 것이 중요하다.
    분모는 그 (스텝, item) 에 **계측값이 있는 wafer** 다. 계측은 lot 당 몇 장만
    하므로 target_total 이 타깃 그룹 크기(n_target)보다 훨씬 작은 것이 정상이다 —
    둘을 같은 것으로 읽으면 커버리지를 과대평가한다. meta.missing_metro 는 계측 행이
    아예 없는 wafer 다.
    p_permutation 은 라벨을 root_lot 안에서 섞었을 때 이만한 분리가 나오는 비율이다.
    p_min_possible 이 크면(예: 0.1 이상) 표본이 작아 p 를 그 아래로 내릴 수 없다는
    뜻이지 신호가 약하다는 뜻이 아니다.
    p_min_possible = 1/(n_reference+1) 이고, n_reference 는 라벨을 섞은 회차 중
    **표본 크기가 그 후보와 같았던 회차 수**라 후보마다 다르다. 그래서 한 결과 안에서
    n_permutations_total 은 같은데 바닥값이 후보마다 갈리는 것이 정상이다 - 모순이
    아니다. **n_reference 가 0이면 p_permutation 도 p_min_possible 도 1.0 인데, 이는
    "우연이다" 가 아니라 "비교할 귀무 표본이 하나도 없었다" 는 뜻이다.** 그 후보는
    분리 점수가 아무리 높아도 통계적 근거가 없으니 채택하지 마라.
    거꾸로 n_reference 가 작으면 p 는 바닥에 걸려 **0.33 같은 큰 값에서 멈춘다.**
    그런 후보는 p 만 보고 "잡음" 으로 버리지 말고 p_min_possible 과 함께 읽어라.
    순위는 두 후보가 **둘 다 표현할 수 있는 해상도**에서 매겨진다. 그래서 p 가 자기
    바닥에 걸린 후보는 **다른 축의** 더 작은 p 에게 지지 않는다 - 바닥 0.111 인
    완전 분리 후보와 다른 축의 p 0.05 후보는 동점이다. p 하나만 보고 "내가 졌다"
    고 판단하지 마라.
    분리 점수는 **같은 축 안에서만** 우열을 가른다. 공통 해상도에서 p 가 같아지면
    같은 축에서는 점수가 높은 쪽이 이긴다 - 그래서 같은 축이라면 바닥에 걸린
    후보도 질 수 있다. 축이 다르면 점수는 쓰지 않는다. 점수는 탐색 폭에 따라
    부풀고 그 정도가 축마다 달라, 축을 넘어 비교하면 탐색이 넓은 축이 늘 이긴다.
    참조 0회(p 도 바닥도 1.0)인 후보는 통계적 근거가 없는 것으로 취급되어, 통계가
    있는 후보들 뒤로 밀린다.
    결과 최상위의 fdr_table 은 임계값별로 "이 목록에 가짜가 몇 개 섞여 있는가" 를
    센 것이다(행의 n_used 는 그 표를 만든 순열
    회차 수이며 n_null_mean 의 해상도를 뜻한다). p_family_wise 는 후보 하나가 아니라
    목록 전체의 1등이 우연일 확률이고, p_family_wise_min_possible 이 그 바닥값이다 -
    둘이 같으면 이 표본으로는 더 내려갈 수 없다는 뜻이지 신호가 약하다는 뜻이 아니다.
    2단 센서(compare_sensor_distribution) 후보에도 claim_id 가 실린다. 그것은
    리포트에서 근거로 인용하기 위한 것이며 finalize 의 지목 대상이 아니다 -
    스텝당 센서가 수백 개인데 다중비교 보정을 하지 않으므로, 효과크기 순위만으로는
    우연한 분리를 가릴 수 없다. 원인을 확정할 때는 가설 도구(hyp_*)가 발급한
    claim_id 를 지목하라. 센서를 안 돌려도 된다는 뜻이 아니다 - '왜' 를 채우는
    근거이고, 그중 효과크기가 판별선을 넘은(passes=true) 후보만 게이트가 리포트에
    함께 싣는다 - 못 넘은 후보는 목록에는 남지만 근거로 나가지 않는다.
