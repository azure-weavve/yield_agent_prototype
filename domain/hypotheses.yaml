- id: eqp_ch_commonality
  name: 설비/챔버 공통성
  description: |
    타깃 전원이 거쳤고 대조군은 안 거친 (공정 스텝, 설비/챔버)를 찾는다.
    1차 legend — 엔지니어가 가장 먼저 돌리는 주 분석. 설비 롤업과 챔버 세부를 함께 낸다.
  legend:
    - {level: equipment, columns: [eqp_id]}
    - {level: chamber, columns: [eqp_id, ch_id]}

- id: ppid_commonality
  name: PPID 공통성
  description: |
    EQP_CH 로 타깃/대조군이 안 갈릴 때, 타깃만 거친 (공정 스텝, PPID)를 찾는다.
    2차 legend — 불량 형태에 따라 선택.
  legend:
    - {level: ppid, columns: [ppid]}

- id: step_passage_commonality
  name: 스텝 통과 공통성
  description: |
    "그 스텝을 거쳤는가" 자체를 후보로 낸다. 비정규 스텝(step_seq 접미 `EC`)처럼
    지나는 lot 과 안 지나는 lot 이 갈리는 축을 잡는다 — 비정규 스텝에서 문제가
    생겨 조치한 이력이 있어 그 자체가 분석 대상이다.
    전원이 거치는 정상 스텝은 타깃·대조군 커버리지가 같아 분리 점수 0 이 되어
    자동으로 탈락한다. 설비/PPID 축과 별개 도구인 이유는 게이트가 "같은 도구 안
    최고 점수" 를 요구하기 때문 — 한 도구에 섞으면 서로를 눌러 한쪽만 승인된다.
  legend:
    - {level: step_passage, columns: [step_seq]}
