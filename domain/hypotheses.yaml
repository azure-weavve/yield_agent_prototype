- id: eqp_ch_commonality
  name: 설비/챔버 공통성
  description: |
    타깃 전원이 거쳤고 대조군은 안 거친 (공정 스텝, 설비/챔버)를 찾는다.
    1차 legend — 엔지니어가 가장 먼저 돌리는 주 분석. 설비 롤업과 챔버 세부를 함께 낸다.
    설비 후보와 챔버 후보가 **같은 wafer 를 가리키면 근거가 둘이 아니라 하나다** —
    한 설명을 굵게/가늘게 부른 것뿐이다. 어느 컬럼이 후보를 정의했는지는 level_columns
    에 있으니(설비 = eqp_id 하나, 챔버 = eqp_id + ch_id) 두 개를 별개 근거로 세지 말고
    챔버 쪽을 지목하라. 게이트가 그 둘을 접어 한 근거로 세고, 리포트에는 굵은 이름을
    함께 적는다.
    분모는 그 스텝에 갔고 그 레벨 컬럼(eqp_id·ch_id)이 결측이 아닌 wafer다 —
    target_total 은 타깃 그룹 크기가 아니다(그룹 크기는 n_target). 한쪽이 그
    질문에 아무도 답하지 못하면 후보를 내지 않는다.
    p_permutation 은 라벨을 root_lot 안에서 섞었을 때 이만한 분리가 나오는 비율이다.
    p_min_possible 이 크면(예: 0.1 이상) 표본이 작아 p 를 그 아래로 내릴 수 없다는
    뜻이지 신호가 약하다는 뜻이 아니다.
    p_min_possible = 1/(n_reference+1) 이고, n_reference 는 라벨을 섞은 회차 중
    **표본 크기가 그 후보와 같았던 회차 수**라 후보마다 다르다. 그래서 한 결과 안에서
    n_permutations_total 은 같은데 바닥값이 후보마다 갈리는 것이 정상이다 - 모순이
    아니다. **n_reference 가 0이면 p_permutation 도 p_min_possible 도 1.0 인데, 이는
    "우연이다" 가 아니라 "비교할 귀무 표본이 하나도 없었다" 는 뜻이다.** 그 후보는
    분리 점수가 아무리 높아도 통계적 근거가 없으니 채택하지 마라.
    거꾸로 n_reference 가 작으면 p 는 바닥에 걸려 **0.33 같은 큰 값에서 멈춘다.**
    그런 후보는 p 만 보고 "잡음" 으로 버리지 말고 p_min_possible 과 함께 읽어라.
    순위는 두 후보가 **둘 다 표현할 수 있는 해상도**에서 매겨진다. 그래서 p 가 자기
    바닥에 걸린 후보는 **다른 축의** 더 작은 p 에게 지지 않는다 - 바닥 0.111 인
    완전 분리 후보와 다른 축의 p 0.05 후보는 동점이다. p 하나만 보고 "내가 졌다"
    고 판단하지 마라.
    분리 점수는 **같은 축 안에서만** 우열을 가른다. 공통 해상도에서 p 가 같아지면
    같은 축에서는 점수가 높은 쪽이 이긴다 - 그래서 같은 축이라면 바닥에 걸린
    후보도 질 수 있다. 축이 다르면 점수는 쓰지 않는다. 점수는 탐색 폭에 따라
    부풀고 그 정도가 축마다 달라, 축을 넘어 비교하면 탐색이 넓은 축이 늘 이긴다.
    참조 0회(p 도 바닥도 1.0)인 후보는 통계적 근거가 없는 것으로 취급되어, 통계가
    있는 후보들 뒤로 밀린다.
    결과 최상위의 fdr_table 은 임계값별로 "이 목록에 가짜가 몇 개 섞여 있는가" 를
    센 것이다(행의 n_used 는 그 표를 만든 순열
    회차 수이며 n_null_mean 의 해상도를 뜻한다 - 19회면 평균이 0, 0.053, 0.105 ...
    값만 가질 수 있다). p_family_wise 는 후보 하나가 아니라 목록 전체의 1등이
    우연일 확률이고, p_family_wise_min_possible 이 그 바닥값이다 - 둘이 같으면
    이 표본으로는 더 내려갈 수 없다는 뜻이지 신호가 약하다는 뜻이 아니다.
    2단 센서(compare_sensor_distribution) 후보에도 claim_id 가 실린다. 그것은
    리포트에서 근거로 인용하기 위한 것이며 finalize 의 지목 대상이 아니다 -
    스텝당 센서가 수백 개인데 다중비교 보정을 하지 않으므로, 효과크기 순위만으로는
    우연한 분리를 가릴 수 없다. 원인을 확정할 때는 가설 도구(hyp_*)가 발급한
    claim_id 를 지목하라. 센서를 안 돌려도 된다는 뜻이 아니다 - '왜' 를 채우는
    근거이고, 그중 효과크기가 판별선을 넘은(passes=true) 후보만 게이트가 리포트에
    함께 싣는다 - 못 넘은 후보는 목록에는 남지만 근거로 나가지 않는다.
  legend:
    - {level: equipment, columns: [eqp_id]}
    - {level: chamber, columns: [eqp_id, ch_id]}

